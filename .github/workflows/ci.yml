# Pushes and pull requests: compile, package and verify both flavours, and
# keep the packages for thirty days. Nothing is published from here: a tag
# publishes, through `release.yml`, the packages of its commit's run, once
# that run has passed.
#
# A commit that never reached main has no run of its own — dispatch this
# workflow on the tag (`gh workflow run ci.yml --ref vX.Y.Z`), which is why
# the tag steps below survive although no tag push starts this any more.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels the run of its old one. A push to main
# keeps its own run however soon the next one follows, since a tag on that
# commit publishes what that run built, and cancelling it destroys the
# artifact the tag needs.
concurrency:
  group: inspector-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  # 0.5.8 shipped CFBundleVersion 82, this workflow's run number at the time it
  # also did the publishing. The counter carries on from there rather than from
  # Version.xcconfig's 13, so the number never goes backwards: LaunchServices
  # keeps the record of the higher build and reads the old Info.plist from it,
  # which is the "plist change that does not take" in the notes. Raise this,
  # never lower it.
  BUILD_NUMBER_FLOOR: "100"

jobs:
  build:
    name: Build and verify Debian packages
    # The iOS 27.1 SDK is what lets the app fill iPhone Duo's displays and
    # move its bar items to the vertical bar; built against anything older it
    # sits letterboxed on the inner display. The macos-26 images stop at
    # Xcode 26, so the build runs on the Xcode 27 image and names its Xcode
    # rather than taking the image's default.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/inspector-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check the iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          IFS=. read -r major minor _ <<<"$sdk.0"
          if (( major < 27 || (major == 27 && minor < 1) )); then
            echo "::error::iPhoneOS SDK $sdk is older than 27.1"
            exit 1
          fi
          echo "iPhoneOS SDK $sdk"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      # The build number is this run's, always: it used to be the run number of
      # the job that published, and with publishing moved out of here nothing
      # would set it at all — every release would ship whatever integer the
      # last `make bump-build` happened to leave in Version.xcconfig. It is
      # floored past the old counter so it keeps going up; see BUILD_NUMBER_FLOOR.
      # The version is the commit's, except on a dispatch against a tag, which
      # is the documented way back when an artifact has aged out.
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          ./Scripts/apply-version.sh "$version" "$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"

      - name: Build Debian packages with Xcode
        run: |
          make deb-all CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA"

      - name: Verify Debian packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make --no-print-directory print-version)"
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Inspector.app"
          DAEMON_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/inspectord"
          CLI_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/inspector"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$VERSION" = "${GITHUB_REF_NAME#v}"
          fi
          test "$(lipo -archs "$APP_PATH/Inspector")" = "arm64"
          test "$(lipo -archs "$DAEMON_PATH")" = "arm64"
          test "$(lipo -archs "$CLI_PATH")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          test "$(sips -g pixelWidth "$APP_PATH/AppIcon60x60@2x.png" 2>/dev/null | awk '/pixelWidth:/ {print $2}')" = "120"
          test "$(sips -g pixelHeight "$APP_PATH/AppIcon60x60@2x.png" 2>/dev/null | awk '/pixelHeight:/ {print $2}')" = "120"
          test "$(sips -g pixelWidth "$APP_PATH/AppIcon76x76@2x~ipad.png" 2>/dev/null | awk '/pixelWidth:/ {print $2}')" = "152"
          test "$(sips -g pixelHeight "$APP_PATH/AppIcon76x76@2x~ipad.png" 2>/dev/null | awk '/pixelHeight:/ {print $2}')" = "152"
          : >build/Packages/SHA256SUMS
          {
            echo '### Debian packages'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for flavor in roothide rootless; do
            DEB_PATH="$(make --no-print-directory print-deb-path FLAVOR="$flavor")"
            ARCHITECTURE="$(dpkg-deb -f "$DEB_PATH" Architecture)"
            case "$flavor" in
              roothide) PREFIX="" ;;
              rootless) PREFIX="/var/jb" ;;
            esac
            ./Scripts/verify-deb.sh "$DEB_PATH" wiki.qaq.inspector "$VERSION" "$ARCHITECTURE" "$PREFIX"
            dpkg-deb --info "$DEB_PATH"
            dpkg-deb --contents "$DEB_PATH"
            DEB_NAME="$(basename "$DEB_PATH")"
            DEB_SIZE="$(stat -f '%z' "$DEB_PATH")"
            DEB_SHA256="$(shasum -a 256 "$DEB_PATH" | awk '{print $1}')"
            printf '%s  %s\n' "$DEB_SHA256" "$DEB_NAME" >>build/Packages/SHA256SUMS
            {
              echo "- \`$DEB_NAME\` ($flavor, $DEB_SIZE bytes)"
              echo "  - SHA-256: \`$DEB_SHA256\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          cat build/Packages/SHA256SUMS
          {
            echo
            echo "- Artifact: \`Inspector-$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Both flavours package the one build, and neither strip nor ldid touches
      # LC_UUID, so one set of dSYMs matches every shipped binary.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make --no-print-directory print-version)"
          DSYM_ZIP="$PWD/build/Packages/Inspector_${VERSION}_dSYMs.zip"
          (cd "$DERIVED_DATA/Build/Products/Release-iphoneos" && zip -qry "$DSYM_ZIP" *.dSYM)
          (cd build/Packages && shasum -a 256 "$(basename "$DSYM_ZIP")" >>SHA256SUMS)

      - name: Upload Debian packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Inspector-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*_dSYMs.zip
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
